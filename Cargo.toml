[workspace]
resolver = "2"
members = [
    "crates/a4n-core",
    "crates/a4n-test-support",
    "crates/a4n-queue",
    "crates/a4n-service-protocol",
    "crates/a4n-sidecar-bootstrap",
    "crates/a4n-capabilities",
    "crates/a4n-service-manager",
    "crates/a4n-demo-sidecar",
    "crates/a4n-model-discovery",
    "crates/a4n-prompt",
    "crates/a4n-prompt-git",
    "crates/a4n-prompt-service",
    "crates/a4n-llm",
    "crates/a4n-llm-http",
    "crates/a4n-llm-gateway",
    "crates/a4n-embedding",
    "crates/a4n-embedding-fastembed",
    "crates/a4n-embedding-service",
    "crates/a4n-rag-core",
    "crates/a4n-rag-index",
    "crates/a4n-rag-service",
    "crates/a4n-image",
    "crates/a4n-image-providers",
    "crates/a4n-image-service",
    "crates/a4n-media",
    "crates/a4n-video",
    "crates/a4n-video-providers",
    "crates/a4n-video-service",
    "crates/a4n-archive-core",
    "crates/a4n-import-core",
    "crates/a4n-import-service",
    "crates/a4n-export-core",
    "crates/a4n-export-service",
    "crates/a4n-domain",
    "crates/a4n-db",
    "crates/a4n-orchestrator",
    "crates/a4n-runtime",
    "crates/a4n-tauri",
    "crates/a4n-migration",
    "crates/a4n-server",
]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
schemars = "1"
jsonschema = { version = "0.40", default-features = false }

# ORM 与数据库
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio", "macros"] }

# 模板引擎
tera = "1"

# 错误处理
anyhow = "1"
thiserror = "2"

# 流式处理
futures = "0.3"

# HTTP 服务端
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# 并发工具
dashmap = "6"
parking_lot = "0.12"
tokio-util = "0.7"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# Tauri
tauri = { version = "2", features = ["devtools"] }
tauri-build = "2"

# 密码学
argon2 = "0.5"
sha2 = "0.10"
jsonwebtoken = "9"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 文件操作
tempfile = "3"
zip = "2"

# 文本处理
similar = "2"
regex = "1"

# 图片处理
image = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
