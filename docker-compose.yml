services:
  postgres:
    image: ${A4N_POSTGRES_IMAGE:-postgres:16}
    container_name: a4n-postgres
    environment:
      POSTGRES_USER: a4n
      POSTGRES_PASSWORD: a4n
      POSTGRES_DB: a4n
    ports:
      - "5432:5432"
    volumes:
      - a4n_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a4n -d a4n"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a4n_pg_data:
