services:
  postgres:
    image: ${A4N_POSTGRES_IMAGE:-postgres:16}
    container_name: a4n-postgres
    environment:
      POSTGRES_USER: a4n
      POSTGRES_PASSWORD: a4n
      POSTGRES_DB: a4n
    ports:
      - "5432:5432"
    volumes:
      - a4n_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a4n -d a4n"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RAG 索引后端（替代 LanceDB + Tantivy）
  qdrant:
    image: ${A4N_QDRANT_IMAGE:-qdrant/qdrant:v1.18.0}
    container_name: a4n-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - a4n_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a4n_pg_data:
  a4n_qdrant_data:
