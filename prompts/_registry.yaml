    used_by:
      - "ObjectProfileDiscovery.discover_object_profiles_for_chapters"
    dependencies:
      - "chapter_fact_extraction"
      - "chapter_summary_synthesis"
      - "chapter_character_state"
      - "chapter_foreshadowing_events"
    description: "从章节正文和章节分析中识别可复用的关键物体档案"

  scene_profile_candidates:
    path: "novel/05_analysis/scene_profile_candidates.md"
