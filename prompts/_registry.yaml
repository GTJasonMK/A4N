    version: "1.0"
    used_by:
      - "SceneProfileDiscovery.sync_scene_profiles_for_chapters"
    dependencies:
      - "chapter_fact_extraction"
      - "chapter_summary_synthesis"
      - "chapter_character_state"
      - "chapter_foreshadowing_events"
      - "object_discovery"
      - "character_discovery"
    description: "场景同步第一阶段：识别或匹配可复用场景档案"

  scene_occurrence_extraction:
    path: "novel/05_analysis/scene_occurrence_extraction.md"
    title: "场景出场抽取"
    category: "analysis"
    tags: ["scene", "occurrence", "extraction"]
    version: "1.0"
    used_by:
      - "SceneProfileDiscovery.sync_scene_profiles_for_chapters"
    dependencies:
      - "scene_profile_candidates"
    description: "场景同步第二阶段：基于场景档案候选抽取当前章节场景出场"

  scene_transition_extraction:
    path: "novel/05_analysis/scene_transition_extraction.md"
    title: "场景转场抽取"
    category: "analysis"
    tags: ["scene", "transition", "extraction"]
    version: "1.0"
    used_by:
      - "SceneProfileDiscovery.sync_scene_profiles_for_chapters"
    dependencies:
      - "scene_profile_candidates"
      - "scene_occurrence_extraction"
    description: "场景同步第三阶段：基于场景与出场链抽取转场"

  scene_entity_state_extraction:
    path: "novel/05_analysis/scene_entity_state_extraction.md"
    title: "场景实体状态抽取"
    category: "analysis"
    tags: ["scene", "entity-state", "extraction"]
    version: "1.0"
    used_by:
      - "SceneProfileDiscovery.sync_scene_profiles_for_chapters"
    dependencies:
      - "scene_profile_candidates"
      - "scene_occurrence_extraction"
    description: "场景同步第四阶段：抽取角色、物体或事件在场景内的状态变化"

  content_optimization:
    path: "novel/05_analysis/content_optimization.md"
    title: "内容优化（Agent Loop）"
    category: "analysis"
    tags: ["optimization", "agent", "editing"]
