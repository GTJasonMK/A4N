# Prompt 注册表 — 提示词中央元数据
#
# 字段说明：
#   prompts.<name>.path         相对此目录的文件路径
#   prompts.<name>.title        显示名
#   prompts.<name>.category     分类 key（必须在 categories: 中定义）
#   prompts.<name>.tags         标签列表（必须显式声明）
#   prompts.<name>.version      初始版本号（必须显式声明）
#   prompts.<name>.used_by      谁调用此提示词（service 函数名，用于反向追溯）
#   prompts.<name>.dependencies 依赖的其他提示词名（用于依赖图/级联 reset）
#   prompts.<name>.description  使用场景描述

version: "1.0"
last_updated: "2026-05-22"

# ============================================================================
# Prompts
# ============================================================================
prompts:
  # ============= 01 构思 =============
  inspiration:
    path: "novel/01_inspiration/inspiration.md"
    title: "灵感对话"
    category: "inspiration"
    tags: ["inspiration", "dialogue", "creative"]
    version: "1.0"
    used_by:
      - "InspirationService.converse"
      - "InspirationService.converse_stream"
    dependencies: []
    description: "AI 扮演\"文思\"角色，与作者多轮对话把模糊灵感锻造成完整小说概念蓝图"

  inspiration_project_context_guard:
    path: "novel/01_inspiration/project_context_guard.md"
    title: "灵感对话项目上下文约束"
    category: "inspiration"
    tags: ["inspiration", "context", "guard"]
    version: "1.0"
    used_by:
      - "InspirationService.build_inspiration_messages"
    dependencies:
      - "inspiration"
    description: "灵感对话追加项目上下文，要求回答优先尊重已有项目事实并忽略数据库技术字段"

  # ============= 02 蓝图 =============
  blueprint:
    path: "novel/02_blueprint/blueprint.md"
    title: "蓝图生成"
    category: "blueprint"
    tags: ["blueprint", "worldbuilding", "character"]
    version: "1.0"
    used_by:
      - "BlueprintPipeline.execute"
    dependencies:
      - "inspiration"
    description: "根据灵感对话记录生成完整故事蓝图（世界观/角色/剧情/主题）"

  blueprint_stage_system:
    path: "novel/02_blueprint/blueprint_stage_system.md"
    title: "蓝图分阶段生成 System 约束"
    category: "blueprint"
    tags: ["blueprint", "staged-generation", "system"]
    version: "1.0"
    used_by:
      - "BlueprintService.generate"
      - "BlueprintService.preview_generate_requests"
    dependencies:
      - "blueprint"
    description: "在完整蓝图提示词上叠加当前分阶段生成约束，确保模型只完成一个蓝图子阶段"

  blueprint_stage_user:
    path: "novel/02_blueprint/blueprint_stage_user.md"
    title: "蓝图分阶段生成 User 请求"
    category: "blueprint"
    tags: ["blueprint", "staged-generation", "user-request"]
    version: "1.0"
    used_by:
      - "BlueprintService.generate"
      - "BlueprintService.preview_generate_requests"
    dependencies:
      - "blueprint_stage_system"
    description: "将蓝图阶段输入、上游阶段上下文和当前输出 schema 渲染为严格 JSON 用户请求"

  blueprint_optimization:
    path: "novel/02_blueprint/blueprint_optimization.md"
    title: "蓝图优化（A4N 自研）"
    category: "blueprint"
    tags: ["blueprint", "optimization"]
    version: "1.0"
    used_by:
      - "BlueprintService.refine"
    dependencies:
      - "blueprint"
    description: "对现有蓝图按 focus 方向迭代优化，保持主线连贯"

  blueprint_optimization_user:
    path: "novel/02_blueprint/blueprint_optimization_user.md"
    title: "蓝图优化 User 请求"
    category: "blueprint"
    tags: ["blueprint", "optimization", "user-request"]
    version: "1.0"
    used_by:
      - "BlueprintService.refine"
      - "BlueprintService.preview_refine_request"
    dependencies:
      - "blueprint_optimization"
    description: "将当前蓝图上下文和用户优化重点整理为严格 JSON 优化请求"

  reverse_blueprint:
    path: "novel/02_blueprint/reverse_blueprint.md"
    title: "蓝图反推"
    category: "blueprint"
    tags: ["导入分析", "蓝图"]
    version: "1.0"
    used_by:
      - "ImportService.reverse_engineer_blueprint"
    dependencies: []
    description: "从已有小说内容反推生成蓝图结构（用于导入分析）"

  # ============= 03 大纲 =============
  outline:
    path: "novel/03_outline/outline.md"
    title: "章节大纲生成"
    category: "outline"
    tags: ["outline", "planning", "chapter"]
    version: "1.0"
    used_by:
      - "OutlineService.generate_chapter_outlines"
      - "OutlineService.generate_chapter_outlines_by_count"
      - "OutlineService.regenerate_chapter_outline"
      - "OutlineService.apply_beat_mapping"
    dependencies:
      - "part_outline_single"
    description: "基于分部大纲生成详细的章节级大纲"

  part_outline_single:
    path: "novel/03_outline/part_outline_single.md"
    title: "分部大纲生成（串行）"
    category: "outline"
    tags: ["outline", "long-form", "serial"]
    version: "1.0"
    used_by:
      - "OutlineService.generate_parts"
      - "OutlineService.continue_part_outline"
      - "OutlineService.regenerate_part_outline"
      - "OutlineService.regenerate_last_part"
    dependencies:
      - "blueprint"
    description: "逐个生成分部大纲，支持上下文传递"

  reverse_outline:
    path: "novel/03_outline/reverse_outline.md"
    title: "大纲反推"
    category: "outline"
    tags: ["导入分析", "大纲"]
    version: "1.0"
    used_by:
      - "ImportService.reverse_engineer_outline"
    dependencies: []
    description: "从已有章节内容反推生成大纲（用于导入分析）"

  reverse_part_outline:
    path: "novel/03_outline/reverse_part_outline.md"
    title: "分部大纲反推"
    category: "outline"
    tags: ["导入分析", "大纲", "长篇"]
    version: "1.0"
    used_by:
      - "ImportService.reverse_engineer_part_outline"
    dependencies: []
    description: "从已有内容反推生成分部大纲结构"

  # ============= 04 写作 =============
  writing:
    path: "novel/04_writing/writing.md"
    title: "章节正文生成"
    category: "writing"
    tags: ["writing", "chapter", "generation"]
    version: "1.0"
    used_by:
      - "ChapterService.generate_stream"
    dependencies:
      - "outline"
    description: "基于章节大纲生成具体的章节正文（场景级流水线）"

  chapter_scene_generation:
    path: "novel/04_writing/chapter_scene_generation.md"
    title: "章节场景生成"
    category: "writing"
    tags: ["writing", "chapter", "scene"]
    version: "1.0"
    used_by:
      - "chapter::scene::generate_chapter_scene"
      - "chapter::scene::preview_chapter_scene_generation_request"
    dependencies:
      - "writing"
      - "outline"
    description: "根据章节摘要、上下文和场景引导生成单个章节场景正文"

  # ============= 05 分析 =============
  character_analysis:
    path: "novel/05_analysis/character_analysis.md"
    title: "角色分析（A4N 自研）"
    category: "analysis"
    tags: ["character", "analysis"]
    version: "1.0"
    used_by:
      - "CharacterService.analyze"
    dependencies: []
    description: "从已有内容反推角色的核心特征、动机与弧光"

  chapter_fact_extraction:
    path: "novel/05_analysis/chapter_fact_extraction.md"
    title: "章节事实抽取"
    category: "analysis"
    tags: ["analysis", "extraction", "facts"]
    version: "1.0"
    used_by:
      - "ChapterAnalysisService.analyze_and_store"
      - "ChapterAnalysisService.build_analysis_requests"
    dependencies:
      - "writing"
    description: "章节结构化分析第一阶段：抽取角色、地点、物品、关键事件和伏笔候选"

  chapter_summary_synthesis:
    path: "novel/05_analysis/chapter_summary_synthesis.md"
    title: "章节摘要综合"
    category: "analysis"
    tags: ["analysis", "summary", "synthesis"]
    version: "1.0"
    used_by:
      - "ChapterAnalysisService.analyze_and_store"
      - "ChapterAnalysisService.build_analysis_requests"
    dependencies:
      - "chapter_fact_extraction"
    description: "章节结构化分析第二阶段：基于事实候选生成摘要、标签、基调和时间标记"

  chapter_character_state:
