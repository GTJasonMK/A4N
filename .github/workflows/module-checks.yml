name: Nightly Full Checks

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  HEAVY_DEP_PATTERN: "a4n-llm-http|a4n-image-providers|a4n-video-providers|a4n-embedding-fastembed|fastembed|hf-hub|lancedb|tantivy|arrow-array|arrow-schema|a4n-prompt-git|git2|libgit2-sys"

jobs:
  host-minimal:
    name: Host minimal profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Check server minimal host
        run: timeout 600 ./scripts/build.sh --check --package a4n-server --no-default-features

      - name: Check tauri minimal host
        run: timeout 600 ./scripts/build.sh --check --package a4n-tauri --no-default-features

      - name: Assert server minimal host excludes heavy providers
        run: |
          set +e
          cargo tree -p a4n-server --no-default-features | rg "$HEAVY_DEP_PATTERN"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "a4n-server minimal host unexpectedly depends on heavy provider/index/git crates" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Assert tauri minimal host excludes heavy providers
        run: |
          set +e
          cargo tree -p a4n-tauri --no-default-features | rg "$HEAVY_DEP_PATTERN"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "a4n-tauri minimal host unexpectedly depends on heavy provider/index/git crates" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Check a4n-core boundary inventory
        run: ./scripts/checks/check-core-boundary.sh

      - name: Check export Worker isolation boundary
        run: timeout 900 ./scripts/checks/check-worker-isolation.sh

      - name: Run CLI integration contract tests
        run: timeout 900 cargo test -p a4n-cli --test cli_e2e -- --nocapture --test-threads=1

  sidecar-catalog:
    name: Read sidecar catalog
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.catalog.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: catalog
        run: |
          source scripts/lib/common.sh
          sidecar_packages="$(sidecar_catalog_binaries)"
          ruby -rjson -e 'puts "packages=#{JSON.generate(STDIN.each_line(chomp: true).to_a)}"' \
            <<<"$sidecar_packages" >> "$GITHUB_OUTPUT"

  sidecars:
    name: Sidecar package ${{ matrix.package }}
    needs: sidecar-catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.sidecar-catalog.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Check sidecar package
        run: timeout 600 cargo check -p "${{ matrix.package }}"

      - name: Check sidecar security and resource boundaries
        run: ./scripts/checks/check-sidecar-security-boundary.sh

  service-manager-process:
    name: Service manager unit and process tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install OpenSSL process test dependency
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Build demo sidecar
        run: cargo build -p a4n-demo-sidecar

      - name: Run unit, ownership, restart and mTLS tests
        env:
          A4N_DEMO_SIDECAR_BIN: ${{ github.workspace }}/target/debug/a4n-demo-sidecar
        run: timeout 300 cargo test -p a4n-service-manager --lib -- --include-ignored --nocapture --test-threads=1

  sidecar-process:
    name: Sidecar process test ${{ matrix.package }}
    needs: sidecar-catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.sidecar-catalog.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Run independent sidecar process test
        run: |
          qdrant_pid=""
          cleanup() {
            if [[ -n "$qdrant_pid" ]] && kill -0 "$qdrant_pid" 2>/dev/null; then
              kill "$qdrant_pid"
              wait "$qdrant_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          if [ "${{ matrix.package }}" = "a4n-rag-service" ]; then
            ./scripts/dev/setup-qdrant.sh
            source scripts/lib/common.sh
            qdrant_log="$CARGO_TARGET_DIR/tmp/rag-process-qdrant.log"
            ./scripts/dev/run-qdrant.sh >"$qdrant_log" 2>&1 &
            qdrant_pid=$!
            wait_for_qdrant "$qdrant_pid" "$qdrant_log"
          fi
          if [ "${{ matrix.package }}" = "a4n-embedding-service" ]; then
            ./scripts/dev/setup-onnxruntime.sh
            source scripts/lib/common.sh
            require_onnxruntime
            timeout 900 cargo test -p a4n-embedding-service --test process -- --nocapture --test-threads=1
          else
            timeout 300 cargo test -p "${{ matrix.package }}" --test process -- --nocapture --test-threads=1
          fi

  build-feedback:
    name: Cold and warm build feedback budget
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            ripgrep

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Check build feedback tooling contracts
        run: ./scripts/checks/check-build-feedback-tools.sh

      - name: Measure cold workspace and warm package feedback
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          source scripts/lib/common.sh
          require_onnxruntime
          timeout 4800 ./scripts/checks/measure-build-feedback.sh --runs 3

      - name: Enforce warm package feedback budget
        run: ./scripts/checks/check-build-feedback-budget.sh

      - name: Upload Cargo timing and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-feedback-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/build-feedback
            scripts/checks/build-feedback-baseline.tsv
          retention-days: 30

  portable-package-layout:
    name: Internal portable package layout ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x86_64
          - windows-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate deploy script syntax
        run: |
          bash -n \
            scripts/deploy.sh \
            scripts/build.sh \
            scripts/dev/setup-onnxruntime.sh \
            scripts/dev/prepare-tauri-external-bin.sh \
            scripts/dev/build-tauri-bundle.sh \
            scripts/checks/check-linux-tauri-installer.sh \
            scripts/checks/check-generation-safety-boundary.sh \
            scripts/checks/smoke-macos-tauri-bundle.sh \
            scripts/checks/generate-release-sbom.sh
          ruby -c scripts/release_update_manifest.rb
          ruby -c scripts/checks/check-updater-release.rb
          ruby -e 'require "json"; JSON.parse(File.read("crates/host/a4n-tauri/tauri.sidecars.conf.json"))'
          ./scripts/checks/check-release-manifest.sh
          ./scripts/checks/check-sidecar-security-boundary.sh
          ./scripts/checks/check-core-boundary.sh
          ./scripts/dev/build-tauri-bundle.sh --help >/dev/null

      - name: Check release package layout
        run: ./scripts/deploy.sh --target "${{ matrix.target }}" --dry-run --no-build

  linux-installer-layout:
    name: Linux deb installer layout
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Build Linux deb installer
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/build-tauri-bundle.sh \
            --target x86_64-unknown-linux-gnu \
            --bundles deb

      - name: Check Linux installer layout
        run: |
          mkdir -p artifacts/linux-installer-check
          packages=(target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          [[ ${#packages[@]} -eq 1 ]]
          ./scripts/checks/check-linux-tauri-installer.sh "${packages[0]}" \
            | tee artifacts/linux-installer-check/result.txt

      - name: Upload Linux installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb-installer-layout
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            artifacts/linux-installer-check
          retention-days: 30

  windows-installer-layout:
    name: Windows MSI installer layout
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Build Windows MSI installer
        shell: bash
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/build-tauri-bundle.sh \
            --target x86_64-pc-windows-msvc \
            --bundles msi

      - name: Check Windows installer layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-installer-check | Out-Null
          $installers = @(Get-ChildItem -Path target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi)
          if ($installers.Count -ne 1) { throw "expected one Windows MSI, found $($installers.Count)" }
          ./scripts/checks/check-windows-tauri-installer.ps1 -Msi $installers[0].FullName |
            Tee-Object -FilePath artifacts\windows-installer-check\result.txt

      - name: Upload Windows installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msi-installer-layout
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            artifacts/windows-installer-check
          retention-days: 30

  macos-tauri-smoke:
    name: macOS arm64 Tauri bundle smoke
    runs-on: macos-15
    timeout-minutes: 120
    env:
      A4N_DATABASE_URL: postgres://a4n@127.0.0.1:5432/a4n_test
      A4N_QDRANT_URL: http://127.0.0.1:6334
      A4N_RELEASE_SMOKE_ARTIFACT_DIR: artifacts/macos-tauri-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ripgrep
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL 16 and migrate a4n_test
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          postgres_bin="$(brew --prefix postgresql@16)/bin"
          export PATH="$postgres_bin:$PATH"
          brew services start postgresql@16
          for _ in {1..60}; do
            pg_isready -h 127.0.0.1 -d postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -d postgres
          psql -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='a4n'" | grep -q 1 || createuser -h 127.0.0.1 -s a4n
          psql -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='a4n_test'" | grep -q 1 || createdb -h 127.0.0.1 -O a4n a4n_test
      - name: Build unsigned macOS arm64 Tauri app
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          cargo install tauri-cli --version 2.12.0 --locked
          ./scripts/dev/build-tauri-bundle.sh \
            --target aarch64-apple-darwin \
            --bundles app,dmg

      - name: Start verified Qdrant and bundled Host
        run: |
          ./scripts/dev/setup-qdrant.sh
          source scripts/lib/common.sh
          mkdir -p artifacts/qdrant
          qdrant_log="$GITHUB_WORKSPACE/artifacts/qdrant/qdrant.log"
          ./scripts/dev/run-qdrant.sh >"$qdrant_log" 2>&1 &
          qdrant_pid=$!
          echo "$qdrant_pid" >"$GITHUB_WORKSPACE/artifacts/qdrant/pid"
          trap 'kill "$qdrant_pid" 2>/dev/null || true; wait "$qdrant_pid" 2>/dev/null || true' EXIT
          wait_for_qdrant "$qdrant_pid" "$qdrant_log"
          A4N_JWT_SECRET="$(openssl rand -hex 32)" \
            ./scripts/checks/smoke-macos-tauri-bundle.sh \
            target/aarch64-apple-darwin/release/bundle/macos/A4N.app

      - name: Verify macOS DMG installer
        run: |
          dmg="$(find target/aarch64-apple-darwin/release/bundle -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_point="$RUNNER_TEMP/a4n-dmg-smoke"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          test -d "$mount_point/A4N.app"
          hdiutil detach "$mount_point" -quiet
          trap - EXIT
          mkdir -p artifacts/macos-installer-check
          shasum -a 256 "$dmg" > artifacts/macos-installer-check/sha256.txt

      - name: Upload macOS installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-tauri-smoke
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifacts/macos-installer-check
            artifacts/macos-tauri-smoke
            artifacts/qdrant
          retention-days: 30

  media-ffmpeg-smoke:
    name: FFmpeg media smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run FFmpeg smoke tests
        run: timeout 600 cargo test -p a4n-media-processing-core --test ffmpeg_smoke -- --ignored --nocapture --test-threads=1

  qdrant-live:
    name: Qdrant live vector-store smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A4N_QDRANT_URL: http://127.0.0.1:6334
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Start verified Qdrant
        run: |
          ./scripts/dev/setup-qdrant.sh
          source scripts/lib/common.sh
          qdrant_log="$CARGO_TARGET_DIR/tmp/qdrant-live.log"
          ./scripts/dev/run-qdrant.sh >"$qdrant_log" 2>&1 &
          qdrant_pid=$!
          trap 'kill "$qdrant_pid" 2>/dev/null || true; wait "$qdrant_pid" 2>/dev/null || true' EXIT
          wait_for_qdrant "$qdrant_pid" "$qdrant_log"
          timeout 600 cargo test -p a4n-rag-index --test qdrant_live -- --ignored --nocapture --test-threads=1

  nightly-matrix:
    name: Nightly quick test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            chromium-driver \
            ffmpeg \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run nightly test matrix
        run: python3 scripts/tests/run_test_matrix.py --profile nightly-quick --report-dir artifacts/nightly-test-matrix

      - name: Upload nightly test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-test-matrix
          path: artifacts/nightly-test-matrix
          retention-days: 14

  workspace-tests:
    name: Full Rust workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install ONNX Runtime
        run: ./scripts/dev/setup-onnxruntime.sh

      - name: Run Rust workspace suite
        run: |
          source scripts/lib/common.sh
          require_onnxruntime
          python3 scripts/tests/run_test_matrix.py \
            --profile nightly \
            --suite rust-workspace \
            --report-dir artifacts/rust-workspace

      - name: Upload workspace test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-workspace-tests
          path: |
            artifacts/rust-workspace
            data/test-runs
          retention-days: 14

  creation-e2e:
    name: Full creation E2E matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      A4N_E2E_CARGO_TARGET_DIR: ${{ github.workspace }}/target/creation-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux creation E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            chromium-driver \
            ffmpeg \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare pinned runtime dependencies
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/setup-qdrant.sh

      - name: Run full creation acceptance
        run: python3 scripts/tests/run_test_matrix.py --profile nightly --suite creation-e2e --report-dir artifacts/creation-e2e-matrix

      - name: Upload creation E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-creation-e2e
          path: |
            artifacts/creation-e2e-matrix
            data/creation-e2e
          retention-days: 14

  generation-host-process:
    name: Generation Web and Tauri process
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install ONNX Runtime
        run: ./scripts/dev/setup-onnxruntime.sh

      - name: Run Web and Tauri generation process tests in one disposable database
        run: |
          source scripts/lib/common.sh
          require_onnxruntime
          python3 scripts/tests/run_with_test_database.py \
          --report-dir artifacts/generation-host-process \
          --timeout 2400 -- \
          bash -c 'set -euo pipefail;
          timeout 900 cargo test --locked -p a4n-server
          --features embedded-llm-provider,embedded-media-providers
          --test cleanup_recovery
          server_process_reconnects_inspiration_sse_ten_times_without_losing_one_mib
          -- --nocapture --test-threads=1;
          timeout 900 cargo test --locked -p a4n-tauri
          --features embedded-media-providers
          tauri_channel_remounts_active_image_generation_after_window_cleanup
          -- --nocapture --test-threads=1'

      - name: Upload generation process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-generation-host-process
          path: artifacts/generation-host-process
          retention-days: 14

  supply-chain:
    name: Advisory, license and SBOM checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@f1b61bf3a1373bccc1ebdc11506122709bd40dee # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@0843b7c6f00e5da5a08f795c041bd69dbba2ba6d # cargo-deny

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@267ee3b185642de47023eface7caa6ec9a5a999c # cargo-cyclonedx

      - name: Run advisory and policy checks
        run: |
          ./scripts/checks/check-audit-exceptions.sh
          cargo audit
          cargo deny check

      - name: Generate Host, tool, and sidecar CycloneDX SBOMs
        run: ./scripts/checks/generate-release-sbom.sh artifacts/supply-chain "ci-${GITHUB_SHA}"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a4n-release-sbom
          path: artifacts/supply-chain

  cross-platform-sidecar-process:
    name: Native sidecar process ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs all manager tests in service-manager-process.
          - os: macos-latest
            binary: target/debug/a4n-demo-sidecar
          - os: windows-latest
            binary: target/debug/a4n-demo-sidecar.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Build demo sidecar
        run: cargo build -p a4n-demo-sidecar

      - name: Exercise manager restart and cleanup
        env:
          A4N_DEMO_SIDECAR_BIN: ${{ github.workspace }}/${{ matrix.binary }}
        run: cargo test -p a4n-service-manager --lib supervisor_restarts_once_and_does_not_replay_in_flight_request -- --ignored --nocapture

      - name: Verify live sidecar log visibility
        env:
          A4N_DEMO_SIDECAR_BIN: ${{ github.workspace }}/${{ matrix.binary }}
        run: cargo test -p a4n-service-manager --lib start_sidecar_launches_demo_and_health_reports_exit -- --ignored --nocapture

  cross-platform-remote-mtls:
    name: Remote mTLS process ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux runs the same mTLS tests in service-manager-process.
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install openssl.light --no-progress -y

      - name: Add OpenSSL to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = Get-ChildItem 'C:\Program Files\OpenSSL*' -Filter openssl.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $openssl) { throw 'openssl.exe was not found after installation' }
          $openssl.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Run cross-platform remote mTLS process test
        run: |
          cargo test -p a4n-service-manager --lib remote_tls_fingerprint_detects_same_length_content_rotation -- --nocapture
          cargo test -p a4n-service-manager --lib remote_mtls_process_handshake_and_certificate_reload -- --ignored --nocapture
