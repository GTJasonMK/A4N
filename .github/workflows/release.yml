name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux-x86_64:
    name: Linux x86_64 installers
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libfuse2t64 libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config rpm

      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Configure updater public key
        run: |
          public_key="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).dig("plugins", "updater", "pubkey")' crates/host/a4n-tauri/tauri.conf.json)"
          test -n "$public_key"
          echo "TAURI_UPDATER_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Build signed deb and rpm packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/build-tauri-bundle.sh \
            --target x86_64-unknown-linux-gnu \
            --release \
            --bundles deb,rpm

      - name: Stage signed release assets
        run: |
          mkdir -p artifacts/linux-x86_64
          find target/x86_64-unknown-linux-gnu/release/bundle -type f \
            \( -name '*.deb' -o -name '*.deb.sig' -o -name '*.rpm' -o -name '*.rpm.sig' \) \
            -exec cp '{}' artifacts/linux-x86_64/ \;
          target/x86_64-unknown-linux-gnu/release/a4n-migration release-data-migrations \
            > artifacts/linux-x86_64/data-migrations.json
          test -n "$(find artifacts/linux-x86_64 -type f -name '*.deb' -print -quit)"
          test -n "$(find artifacts/linux-x86_64 -type f -name '*.rpm' -print -quit)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64
          if-no-files-found: error
          retention-days: 14

  windows-x86_64:
    name: Windows x86_64 installer
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Configure updater public key
        shell: bash
        run: |
          public_key="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).dig("plugins", "updater", "pubkey")' crates/host/a4n-tauri/tauri.conf.json)"
          test -n "$public_key"
          echo "TAURI_UPDATER_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Build signed MSI installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/build-tauri-bundle.sh \
            --target x86_64-pc-windows-msvc \
            --release \
            --bundles msi

      - name: Stage signed release assets
        shell: bash
        run: |
          mkdir -p artifacts/windows-x86_64
          find target/x86_64-pc-windows-msvc/release/bundle -type f \
            \( -name '*.msi' -o -name '*.msi.zip' -o -name '*.msi.zip.sig' \) \
            -exec cp '{}' artifacts/windows-x86_64/ \;
          test -n "$(find artifacts/windows-x86_64 -type f -name '*.msi' -print -quit)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS Apple Silicon installer
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      - name: Configure updater public key
        run: |
          public_key="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).dig("plugins", "updater", "pubkey")' crates/host/a4n-tauri/tauri.conf.json)"
          test -n "$public_key"
          echo "TAURI_UPDATER_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Build signed DMG installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/dev/setup-onnxruntime.sh
          ./scripts/dev/build-tauri-bundle.sh \
            --target aarch64-apple-darwin \
            --release \
            --bundles app,dmg

      - name: Stage signed release assets
        run: |
          mkdir -p artifacts/macos-arm64
          find target/aarch64-apple-darwin/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec cp '{}' artifacts/macos-arm64/ \;
          test -n "$(find artifacts/macos-arm64 -type f -name '*.dmg' -print -quit)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create and verify draft release
    needs: [linux-x86_64, windows-x86_64, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts

      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("packages").find { |package| package.fetch("name") == "a4n-tauri" }.fetch("version")')"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Assemble release assets and signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name 'data-migrations.json' -exec cp '{}' release-assets/ \;
          migration_file=artifacts/linux-x86_64/data-migrations.json
          test -f "$migration_file"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            test "$is_draft" = "true" || { echo "refusing to modify a published release" >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.md
          ruby scripts/release_update_manifest.rb \
            --version "${{ steps.version.outputs.version }}" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --notes release-notes.md \
            --migrations "$migration_file" \
            --output release-assets/latest.json
          (cd release-assets && sha256sum * > SHA256SUMS)
          ruby scripts/checks/check-updater-release.rb \
            --assets release-assets \
            --manifest release-assets/latest.json \
            --version "${{ steps.version.outputs.version }}" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --tauri-config crates/host/a4n-tauri/tauri.conf.json

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Download and verify published draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          (cd downloaded-assets && sha256sum -c SHA256SUMS)
          ruby scripts/checks/check-updater-release.rb \
            --assets downloaded-assets \
            --manifest downloaded-assets/latest.json \
            --version "${{ steps.version.outputs.version }}" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --tauri-config crates/host/a4n-tauri/tauri.conf.json

      - name: Keep release as draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
