<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 648" role="img" aria-labelledby="title desc">
  <title id="title">Client calls and task recovery</title>
  <desc id="desc">Desktop defaults to HTTP through the local Server or uses Tauri in Native mode. Web and CLI use Server. Both hosts share Host API and call Orchestrator through ApplicationPorts, connecting to databases, files, indexes, models and workers. Arrows show runtime calls, not direct Rust dependencies. The recovery flow only applies to supported tasks: load completed checkpoints, validate inputs, then reuse completed results and continue the remaining steps when matching and workflow recovery rules allow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10" fill="#34699a"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#233343;font-size:24px}
      .label{font-weight:600}.note{font-size:20px;fill:#516372}
      .flow{fill:none;stroke:#34699a;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="648" rx="8" fill="#fff"/>

  <path d="M160 88V144" class="flow"/>
  <text x="176" y="126" class="note">Native</text>
  <path d="M280 60H352V170H440" class="flow"/>
  <text x="374" y="126" class="note">HTTP · default</text>
  <path d="M620 88V144" class="flow"/>
  <path d="M1060 88V144" class="flow"/>
  <rect x="40" y="32" width="240" height="56" rx="5" fill="#f7f9fb" stroke="#cbd5df"/>
  <text x="160" y="68" text-anchor="middle" class="label">Desktop</text>
  <rect x="480" y="32" width="280" height="56" rx="5" fill="#f7f9fb" stroke="#cbd5df"/>
  <text x="620" y="68" text-anchor="middle" class="label">Web</text>
  <rect x="960" y="32" width="200" height="56" rx="5" fill="#f7f9fb" stroke="#cbd5df"/>
  <text x="1060" y="68" text-anchor="middle" class="label">CLI</text>

  <rect x="40" y="144" width="240" height="52" rx="5" fill="#fff" stroke="#aebecb"/>
  <text x="160" y="178" text-anchor="middle" class="label">Tauri</text>
  <rect x="440" y="144" width="720" height="52" rx="5" fill="#fff" stroke="#aebecb"/>
  <text x="800" y="178" text-anchor="middle" class="label">Server</text>
  <path d="M160 196V270H344" class="flow"/>
  <path d="M800 196V244" class="flow"/>

  <rect x="344" y="244" width="512" height="52" rx="5" fill="#f3f7fb" stroke="#afc8de"/>
  <text x="600" y="278" text-anchor="middle" class="label">Host API</text>
  <path d="M600 296V340" class="flow"/>
  <text x="624" y="327" class="note">ApplicationPorts</text>
  <rect x="344" y="340" width="512" height="56" rx="5" fill="#e1edf7" stroke="#91b3ce"/>
  <text x="600" y="376" text-anchor="middle" class="label">Orchestrator</text>

  <path d="M600 396V418H180V440" class="flow"/>
  <path d="M600 418V440" class="flow"/>
  <path d="M600 418H1020V440" class="flow"/>
  <rect x="40" y="440" width="280" height="56" rx="5" fill="#f2f8f6" stroke="#b4d0c9"/>
  <text x="180" y="476" text-anchor="middle">PostgreSQL</text>
  <rect x="460" y="440" width="280" height="56" rx="5" fill="#f2f8f6" stroke="#b4d0c9"/>
  <text x="600" y="476" text-anchor="middle">Files / indexes</text>
  <rect x="880" y="440" width="280" height="56" rx="5" fill="#f2f8f6" stroke="#b4d0c9"/>
  <text x="1020" y="476" text-anchor="middle">Models / workers</text>

  <path d="M40 528H1160" stroke="#e2e8ee"/>
  <rect x="80" y="560" width="256" height="56" rx="5" fill="#f2f8f6" stroke="#b4d0c9"/>
  <text x="208" y="596" text-anchor="middle" class="label">Checkpoint</text>
  <path d="M336 588H472" class="flow"/>
  <rect x="472" y="560" width="256" height="56" rx="5" fill="#f3f7fb" stroke="#afc8de"/>
  <text x="600" y="596" text-anchor="middle" class="label">Validate inputs</text>
  <path d="M728 588H904" class="flow"/>
  <text x="816" y="574" text-anchor="middle" class="note">Match</text>
  <rect x="904" y="560" width="256" height="56" rx="5" fill="#f3f7fb" stroke="#afc8de"/>
  <text x="1032" y="596" text-anchor="middle" class="label">Resume</text>
</svg>
