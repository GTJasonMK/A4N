<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">写下一章时，前面的内容怎么用上</title>
  <desc id="desc">原文片段支撑结构化提取，资料自动同步；后续写作按目标检索前序章节。作者审阅补丁后才写回正文。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10" fill="#34699a"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10" fill="#a76524"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#233343;font-size:20px}
      .heading{font-size:28px;font-weight:700}.panel{font-size:24px;font-weight:700}.label{font-size:22px;font-weight:600}.note{font-size:20px;fill:#516372}
      .flow{fill:none;stroke:#34699a;stroke-width:2;marker-end:url(#blue)}.manual{fill:none;stroke:#a76524;stroke-width:2;marker-end:url(#amber)}
    </style>
  </defs>
  <rect width="1200" height="1010" rx="8" fill="#fff"/>
  <text x="40" y="47" class="heading">写下一章时，前面的内容怎么用上</text>
  <text x="40" y="80" class="note">以《山海之间》的两章为例</text>
  <path d="M1160 688H1182V98H22V281H30" class="manual" stroke-dasharray="5 6" opacity=".65"/>
  <text x="40" y="132" class="panel">(a) 分析第 1 章，记录人物和情节</text>
  <path d="M314 281H344" class="manual"/>
  <path d="M530 281H575" class="flow"/>

  <rect x="47" y="150" width="267" height="244" rx="5" fill="#f3f5f7" stroke="#d4dde5"/>
  <rect x="40" y="158" width="274" height="248" rx="5" fill="#fff" stroke="#aebecb"/>
  <text x="58" y="190" class="label" style="font-size:22px">第 1 章 · 未寄出的信</text>
  <path d="M58 205H296" stroke="#d4dde5"/>
  <path d="M58 219V276M58 294V344" stroke="#6d9b91" stroke-width="3"/>
  <text x="73" y="242">秒针逆着刻度</text>
  <text x="73" y="270">走了整整一圈</text>
  <text x="73" y="315">周衡身后的影子</text>
  <text x="73" y="343">却没有跟着移动</text>
  <rect x="60" y="363" width="234" height="30" rx="4" fill="#fff7ed" stroke="#c89762"/>
  <text x="177" y="385" text-anchor="middle" style="fill:#945a24">发起章节分析</text>

  <rect x="354" y="179" width="176" height="205" rx="5" fill="#f3f7fb" stroke="#afc8de"/>
  <text x="442" y="211" text-anchor="middle" class="label" style="font-size:22px">结构化分析</text>
  <path d="M372 225H512" stroke="#cfdeeb"/>
  <circle cx="376" cy="245" r="3" fill="#34699a"/><text x="389" y="252" style="font-size:20px">事实</text>
  <circle cx="376" cy="279" r="3" fill="#34699a"/><text x="389" y="286" style="font-size:20px">摘要</text>
  <circle cx="376" cy="313" r="3" fill="#34699a"/><text x="389" y="320" style="font-size:20px">人物状态</text>
  <circle cx="376" cy="347" r="3" fill="#34699a"/><text x="389" y="354" style="font-size:20px">伏笔 / 事件</text>

  <rect x="591" y="150" width="569" height="250" rx="5" fill="#f2f7f6" stroke="#c8dbd7"/>
  <rect x="585" y="156" width="569" height="250" rx="5" fill="#fff" stroke="#6d9b91" stroke-width="1.5"/>
  <text x="607" y="190" class="label">分析后留下的资料</text>
  <path d="M607 205H1132" stroke="#c8dbd7"/>
  <text x="607" y="242" class="note">物体线索</text><text x="762" y="242" style="fill:#286e61">旧怀表：秒针逆行</text>
  <text x="607" y="291" class="note">人物状态</text><text x="762" y="291" style="fill:#286e61">林岚：对周衡保持警觉</text>
  <text x="607" y="340" class="note">未解伏笔</text><text x="762" y="340" style="fill:#286e61">周衡的影子没有回退</text>
  <path d="M607 360H1132" stroke="#dce7e4"/>
  <text x="607" y="389" class="note">回顾章纲、档案与检索索引自动同步</text>
  <text x="40" y="438" class="note">关键提取回指原文片段；作者正式章纲得到保留</text>
  <path d="M898 406V508H778V519" class="flow"/>

  <path d="M40 461H1160" stroke="#e2e8ee"/>
  <text x="40" y="499" class="panel">(b) 准备第 2 章：按章纲和线索查前文</text>
  <path d="M360 630H405" class="flow"/>
  <path d="M808 630H852" class="flow"/>
  <rect x="40" y="529" width="320" height="204" rx="5" fill="#fff" stroke="#aebecb"/>
  <text x="60" y="567" class="label">第 2 章 · 写作目标</text>
  <rect x="60" y="586" width="134" height="36" rx="4" fill="#f3f7fb" stroke="#d4e2ed"/><text x="127" y="610" text-anchor="middle" style="font-size:20px">章纲 / 要点</text>
  <rect x="206" y="586" width="134" height="36" rx="4" fill="#f3f7fb" stroke="#d4e2ed"/><text x="273" y="610" text-anchor="middle" style="font-size:20px">相关人物</text>
  <rect x="60" y="635" width="134" height="36" rx="4" fill="#f3f7fb" stroke="#d4e2ed"/><text x="127" y="659" text-anchor="middle" style="font-size:20px">待回收伏笔</text>
  <rect x="206" y="635" width="134" height="36" rx="4" fill="#f3f7fb" stroke="#d4e2ed"/><text x="273" y="659" text-anchor="middle" style="font-size:20px">场景线索</text>
  <text x="60" y="715" class="note" style="font-size:20px">候选查询按当前资料选取</text>

  <rect x="415" y="529" width="393" height="204" rx="5" fill="#f7fafc" stroke="#afc8de"/>
  <text x="435" y="567" class="label">前序检索 → 上下文组装</text>
  <rect x="435" y="581" width="353" height="38" rx="3" fill="#e1edf7"/><path d="M439 589V611" stroke="#34699a" stroke-width="3"/><text x="452" y="607" style="font-size:20px">关键连续性</text><text x="610" y="607" class="note" style="font-size:18px">状态与事件优先</text>
  <rect x="435" y="628" width="353" height="38" rx="3" fill="#edf3f8"/><path d="M439 636V658" stroke="#34699a" stroke-width="3"/><text x="452" y="654" style="font-size:20px">相关摘要</text><text x="610" y="654" class="note" style="font-size:18px">回顾相关章节</text>
  <rect x="435" y="675" width="353" height="38" rx="3" fill="#edf3f8"/><path d="M439 683V705" stroke="#34699a" stroke-width="3"/><text x="452" y="701" style="font-size:20px">参考原文</text><text x="610" y="701" class="note" style="font-size:18px">保留可核对片段</text>

  <rect x="862" y="529" width="298" height="204" rx="5" fill="#fff" stroke="#aebecb"/>
  <text x="882" y="567" class="label">带入后续生成</text>
  <path d="M882 588H1139M882 600H1108" stroke="#d4dde5" stroke-width="3"/>
  <text x="882" y="636">当前章纲与写作要求</text>
  <text x="882" y="670">选取的前文依据</text>
  <text x="882" y="712" style="fill:#945a24">作者审阅并保存</text>
  <rect x="40" y="751" width="768" height="42" rx="4" fill="#f3f5f7"/>
  <text x="60" y="779" class="note">检索边界：第 1 章 … 当前章之前</text>
  <text x="1011" y="766" text-anchor="middle" style="fill:#945a24">保存后的新正文</text>
  <text x="1011" y="792" text-anchor="middle" style="fill:#945a24">可再次进入分析</text>

  <path d="M40 817H1160" stroke="#e2e8ee"/>
  <text x="40" y="853" class="panel">(c) 修改先预览，确认后写入正文</text>
  <path d="M340 914H395" class="flow"/>
  <path d="M725 914H780" class="manual"/>
  <rect x="40" y="875" width="300" height="78" rx="5" fill="#f2f8f6" stroke="#b4d0c9"/>
  <text x="57" y="907" class="label" style="font-size:22px">在原文范围内提出局部修改</text>
  <text x="57" y="936" class="note" style="font-size:20px">提案先保存，正文不变</text>
  <rect x="405" y="875" width="320" height="78" rx="5" fill="#fff7ed" stroke="#c89762"/>
  <text x="423" y="907" class="label" style="font-size:22px">作者审阅修改建议</text>
  <text x="423" y="936" class="note">确认写回 / 拒绝保留正文</text>
  <rect x="790" y="875" width="370" height="78" rx="5" fill="#f7f9fb" stroke="#cbd5df"/>
  <text x="808" y="907" class="label">写回前检查源内容指纹</text>
  <text x="808" y="936" class="note" style="font-size:20px">原文已变时，阻止过期补丁</text>
  <path d="M40 980H70" stroke="#34699a" stroke-width="2"/><text x="82" y="987" style="font-size:18px">自动流程</text>
  <path d="M211 980H241" stroke="#a76524" stroke-width="2"/><text x="253" y="987" style="font-size:18px">作者操作</text>
  <rect x="399" y="972" width="20" height="16" rx="2" fill="#f2f8f6" stroke="#6d9b91"/><text x="430" y="987" style="font-size:18px">已保存资料</text>
  <text x="1160" y="987" text-anchor="end" class="note" style="font-size:18px">机制示意 · 非生成效果评测</text>
</svg>
