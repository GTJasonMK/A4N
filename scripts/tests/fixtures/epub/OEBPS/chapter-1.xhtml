<body>
  <h1>第1章 雨夜来信</h1>
  <p>暴雨敲打旧车站的玻璃。林岚在末班车座位下发现一封写给十年后自己的信，信中准确预告了站台即将停电。</p>
  <p>她没有离开，而是沿着信里画出的路线走进废弃的钟楼。十二点整，停摆多年的大钟重新响了一声。</p>
