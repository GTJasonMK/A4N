[package]
name = "a4n-control"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = [
    "a4n-runtime/embedded-capabilities",
]
embedded-llm-provider = [
    "a4n-runtime/embedded-llm-provider",
]
embedded-media-providers = [
    "a4n-runtime/embedded-media-providers",
]

[dependencies]
a4n-agent-runtime-contract = { workspace = true }
a4n-api-contract = { workspace = true }
a4n-config = { workspace = true }
a4n-domain = { workspace = true }
a4n-error = { workspace = true, features = ["database"], default-features = true }
a4n-llm-provider-contract = { workspace = true }
a4n-media = { workspace = true }
a4n-host-assembly = { workspace = true }
a4n-runtime = { workspace = true, default-features = false }
a4n-service-protocol = { workspace = true }
a4n-storage = { workspace = true }
a4n-task-runtime = { workspace = true }
a4n-worker-contract = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true }

[dev-dependencies]
a4n-db = { workspace = true }
a4n-db-models = { workspace = true }
a4n-image-host-contract = { workspace = true }
a4n-migration = { workspace = true }
sea-orm = { workspace = true }
tempfile = { workspace = true }
