[package]
name = "a4n-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
migration = ["a4n-db/migration"]
embedded-capabilities = [
    "embedded-prompt-git",
    "embedded-llm-provider",
    "local-embedding",
    "embedded-rag-index",
    "embedded-media-providers",
]
embedded-prompt-git = ["dep:a4n-prompt-git"]
embedded-llm-provider = ["dep:a4n-llm-http"]
local-embedding = ["dep:a4n-embedding-fastembed"]
embedded-rag-index = ["dep:a4n-rag-index"]
embedded-media-providers = [
    "dep:a4n-image-providers",
    "dep:a4n-video-providers",
]

[dependencies]
a4n-agent-runtime = { workspace = true }
a4n-agent-runtime-contract = { workspace = true }
a4n-artifact-media-contract = { workspace = true }
a4n-api-contract = { workspace = true }
a4n-blueprint-contract = { workspace = true }
a4n-chapter-generation-contract = { workspace = true }
a4n-chapter-analysis-host-contract = { workspace = true }
a4n-character-host-contract = { workspace = true }
a4n-optimize-host-contract = { workspace = true }
a4n-portrait-host-contract = { workspace = true }
a4n-scene-host-contract = { workspace = true }
a4n-cleanup-contract = { workspace = true }
a4n-canvas-contract = { workspace = true }
a4n-canvas-host-contract = { workspace = true }
a4n-outline-contract = { workspace = true }
a4n-config = { workspace = true }
a4n-db = { workspace = true }
a4n-db-models = { workspace = true }
a4n-domain = { workspace = true }
a4n-error = { workspace = true, default-features = true }
a4n-event = { workspace = true }
a4n-galgame-host-contract = { workspace = true }
a4n-generation-host-contract = { workspace = true }
a4n-embedding-contract = { workspace = true }
a4n-embedding-provider-contract = { workspace = true }
a4n-process-catalog = { workspace = true }
a4n-service-protocol = { workspace = true }
a4n-service-client = { workspace = true }
a4n-task-runtime = { workspace = true }
a4n-provider-contract = { workspace = true }
a4n-provider-runtime-contract = { workspace = true }
a4n-llm-provider-contract = { workspace = true }
a4n-novel-host-contract = { workspace = true }
a4n-queue = { workspace = true }
a4n-prompt = { workspace = true }
a4n-prompt-client = { workspace = true }
a4n-prompt-git = { workspace = true, optional = true }
a4n-llm-context = { workspace = true }
a4n-llm-client = { workspace = true }
a4n-llm-sidecar-contract = { workspace = true }
a4n-llm-config = { workspace = true }
a4n-llm-http = { workspace = true, optional = true }
a4n-media = { workspace = true }
a4n-media-client = { workspace = true }
a4n-media-contract = { workspace = true }
a4n-media-processing-core = { workspace = true }
a4n-embedding-providers = { workspace = true }
a4n-embedding-fastembed = { workspace = true, optional = true }
a4n-archive-core = { workspace = true }
a4n-embedding-client = { workspace = true }
a4n-export-client = { workspace = true }
a4n-export-contract = { workspace = true }
a4n-import-client = { workspace = true }
a4n-import-contract = { workspace = true }
a4n-rag-core = { workspace = true }
a4n-rag-client = { workspace = true }
a4n-rag-contract = { workspace = true }
a4n-rag-sidecar-contract = { workspace = true }
a4n-rag-index = { workspace = true, optional = true }
a4n-image-contract = { workspace = true }
a4n-image-host-contract = { workspace = true }
a4n-inspiration-host-contract = { workspace = true }
a4n-import-analysis-host-contract = { workspace = true }
