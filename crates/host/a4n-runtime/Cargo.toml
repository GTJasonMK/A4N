a4n-video-sidecar-contract = { workspace = true }
a4n-video-providers = { workspace = true, optional = true }
a4n-worker-contract = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
