[package]
name = "a4n-tauri"
version = "0.1.0"
edition = "2024"
default-run = "a4n-tauri"
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["tauri-build"]

[lib]
name = "a4n_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["migration"]
embedded-transforms = ["a4n-runtime/embedded-transforms"]
migration = ["a4n-runtime/migration"]
embedded-capabilities = [
    "migration",
    "a4n-runtime/embedded-capabilities",
]
embedded-media-providers = [
    "migration",
    "a4n-runtime/embedded-media-providers",
]
video-scrub-e2e-host = ["dep:base64"]

[[bin]]
name = "a4n-video-scrub-e2e-host"
path = "src/video_scrub_e2e_host.rs"
required-features = ["video-scrub-e2e-host"]

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
a4n-api-contract = { workspace = true }
a4n-control = { workspace = true }
a4n-config = { workspace = true }
a4n-error = { workspace = true, features = ["database"], default-features = true }
a4n-host-assembly = { workspace = true }
a4n-media = { workspace = true }
a4n-process-catalog = { workspace = true }
a4n-worker-client = { workspace = true }
a4n-runtime = { workspace = true, default-features = false }
a4n-service-protocol = { workspace = true }
a4n-storage = { workspace = true }
a4n-task-runtime = { workspace = true }
uuid = { workspace = true }

# 异步
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }

# 配置解析
toml = "0.9"

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"

# 并发工具
tokio-util = { workspace = true }
base64 = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
a4n-db = { workspace = true }
a4n-migration = { workspace = true }
a4n-test-support = { workspace = true }
base64 = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true, features = ["test"] }
