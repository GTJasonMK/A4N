[package]
name = "a4n-rag-index"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
a4n-domain = { path = "../a4n-domain" }
a4n-rag-core = { path = "../a4n-rag-core" }

async-trait = { workspace = true }
qdrant-client = { version = "1.18", default-features = true, features = ["uuid", "serde"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
