[package]
name = "a4n-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = [
    "a4n-control/embedded-capabilities",
]
embedded-llm-provider = [
    "a4n-control/embedded-llm-provider",
]
embedded-media-providers = [
    "a4n-control/embedded-media-providers",
]

[dependencies]
a4n-control = { path = "../a4n-control" }

anyhow = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
a4n-db = { path = "../a4n-db" }
a4n-db-models = { path = "../a4n-db-models" }
a4n-migration = { path = "../a4n-migration" }
a4n-queue = { path = "../a4n-queue" }
reqwest = { workspace = true }
sea-orm = { workspace = true }
tempfile = { workspace = true }
