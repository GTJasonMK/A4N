a4n-import-analysis-host-contract = { path = "../a4n-import-analysis-host-contract" }
a4n-image-client = { path = "../a4n-image-client" }
a4n-image-provider-contract = { path = "../a4n-image-provider-contract" }
a4n-import-core = { path = "../a4n-import-core" }
a4n-image-providers = { path = "../a4n-image-providers", optional = true }
a4n-model-discovery = { path = "../a4n-model-discovery" }
