a4n-object-profile-worker-client = { path = "../a4n-object-profile-worker-client" }
a4n-scene-profile-worker-client = { path = "../a4n-scene-profile-worker-client" }
a4n-service-manager = { path = "../a4n-service-manager" }
a4n-storage = { path = "../a4n-storage" }
a4n-video = { path = "../a4n-video" }
a4n-video-client = { path = "../a4n-video-client" }
a4n-video-contract = { path = "../a4n-video-contract" }
a4n-video-host-contract = { path = "../a4n-video-host-contract" }
a4n-video-sidecar-contract = { path = "../a4n-video-sidecar-contract" }
a4n-video-providers = { path = "../a4n-video-providers", optional = true }
a4n-worker-contract = { path = "../a4n-worker-contract" }
a4n-migration = { path = "../a4n-migration", optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
