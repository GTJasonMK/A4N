[package]
name = "a4n-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
migration = ["dep:a4n-migration"]
embedded-capabilities = [
    "embedded-prompt-git",
    "embedded-llm-provider",
    "local-embedding",
    "embedded-rag-index",
    "embedded-media-providers",
]
embedded-prompt-git = ["dep:a4n-prompt-git"]
embedded-llm-provider = ["dep:a4n-llm-http"]
local-embedding = ["dep:a4n-embedding-fastembed"]
embedded-rag-index = ["dep:a4n-rag-index"]
embedded-media-providers = [
    "dep:a4n-image-providers",
    "dep:a4n-video-providers",
]

[dependencies]
a4n-agent-runtime = { path = "../a4n-agent-runtime" }
a4n-agent-runtime-contract = { path = "../a4n-agent-runtime-contract" }
a4n-artifact-media-contract = { path = "../a4n-artifact-media-contract" }
a4n-api-contract = { path = "../a4n-api-contract" }
a4n-blueprint-contract = { path = "../a4n-blueprint-contract" }
a4n-chapter-generation-contract = { path = "../a4n-chapter-generation-contract" }
a4n-chapter-analysis-host-contract = { path = "../a4n-chapter-analysis-host-contract" }
a4n-character-host-contract = { path = "../a4n-character-host-contract" }
a4n-optimize-host-contract = { path = "../a4n-optimize-host-contract" }
a4n-portrait-host-contract = { path = "../a4n-portrait-host-contract" }
a4n-scene-host-contract = { path = "../a4n-scene-host-contract" }
a4n-cleanup-contract = { path = "../a4n-cleanup-contract" }
a4n-canvas-contract = { path = "../a4n-canvas-contract" }
a4n-canvas-host-contract = { path = "../a4n-canvas-host-contract" }
a4n-outline-contract = { path = "../a4n-outline-contract" }
a4n-config = { path = "../a4n-config" }
a4n-db-models = { path = "../a4n-db-models" }
a4n-db = { path = "../a4n-db" }
a4n-domain = { path = "../a4n-domain" }
a4n-error = { path = "../a4n-error", features = ["database"] }
a4n-event = { path = "../a4n-event" }
a4n-galgame-host-contract = { path = "../a4n-galgame-host-contract" }
a4n-generation-host-contract = { path = "../a4n-generation-host-contract" }
a4n-embedding-contract = { path = "../a4n-embedding-contract" }
a4n-embedding-provider-contract = { path = "../a4n-embedding-provider-contract" }
a4n-process-catalog = { path = "../a4n-process-catalog" }
a4n-service-protocol = { path = "../a4n-service-protocol" }
a4n-service-client = { path = "../a4n-service-client" }
a4n-task-runtime = { path = "../a4n-task-runtime", features = ["persistent"] }
a4n-provider-contract = { path = "../a4n-provider-contract" }
a4n-provider-runtime-contract = { path = "../a4n-provider-runtime-contract" }
a4n-llm-provider-contract = { path = "../a4n-llm-provider-contract" }
a4n-novel-host-contract = { path = "../a4n-novel-host-contract" }
a4n-queue = { path = "../a4n-queue" }
a4n-prompt = { path = "../a4n-prompt" }
a4n-prompt-client = { path = "../a4n-prompt-client" }
a4n-prompt-git = { path = "../a4n-prompt-git", optional = true }
a4n-llm-context = { path = "../a4n-llm-context" }
a4n-llm-client = { path = "../a4n-llm-client" }
a4n-llm-sidecar-contract = { path = "../a4n-llm-sidecar-contract" }
