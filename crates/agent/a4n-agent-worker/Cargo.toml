[package]
name = "a4n-agent-worker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = []
embedded-llm-provider = []
embedded-media-providers = []

[dependencies]
a4n-agent-application = { workspace = true }
a4n-agent-runtime = { workspace = true }
a4n-agent-runtime-contract = { workspace = true }
a4n-api-contract = { workspace = true }
a4n-config = { workspace = true }
a4n-db = { workspace = true }
a4n-error = { workspace = true, default-features = true }
a4n-llm-provider-contract = { workspace = true }
a4n-worker-contract = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
sea-orm = { workspace = true }
