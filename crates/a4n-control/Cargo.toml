[package]
name = "a4n-control"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = [
    "a4n-runtime/embedded-capabilities",
]
embedded-llm-provider = [
    "a4n-runtime/embedded-llm-provider",
]
embedded-media-providers = [
    "a4n-runtime/embedded-media-providers",
]

[dependencies]
a4n-agent-runtime-contract = { path = "../a4n-agent-runtime-contract" }
a4n-api-contract = { path = "../a4n-api-contract" }
a4n-config = { path = "../a4n-config" }
a4n-domain = { path = "../a4n-domain" }
a4n-error = { path = "../a4n-error", features = ["database"] }
a4n-llm-provider-contract = { path = "../a4n-llm-provider-contract" }
a4n-media = { path = "../a4n-media" }
a4n-host-assembly = { path = "../a4n-host-assembly" }
a4n-runtime = { path = "../a4n-runtime", default-features = false }
a4n-service-protocol = { path = "../a4n-service-protocol" }
a4n-storage = { path = "../a4n-storage" }
a4n-task-runtime = { path = "../a4n-task-runtime" }
a4n-worker-contract = { path = "../a4n-worker-contract" }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true }

[dev-dependencies]
a4n-db = { path = "../a4n-db" }
a4n-db-models = { path = "../a4n-db-models" }
a4n-image-host-contract = { path = "../a4n-image-host-contract" }
a4n-migration = { path = "../a4n-migration" }
sea-orm = { workspace = true }
tempfile = { workspace = true }
