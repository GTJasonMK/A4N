[package]
name = "a4n-embedding-service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["fastembed"]
fastembed = ["dep:a4n-embedding-fastembed"]

[dependencies]
a4n-domain = { path = "../a4n-domain" }
a4n-embedding = { path = "../a4n-embedding" }
a4n-embedding-fastembed = { path = "../a4n-embedding-fastembed", optional = true }
a4n-sidecar-bootstrap = { path = "../a4n-sidecar-bootstrap" }
a4n-service-protocol = { path = "../a4n-service-protocol" }

anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
a4n-test-support = { path = "../a4n-test-support" }
