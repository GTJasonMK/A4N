[package]
name = "a4n-agent-worker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = ["a4n-runtime/embedded-capabilities"]
embedded-llm-provider = ["a4n-runtime/embedded-llm-provider"]
embedded-media-providers = ["a4n-runtime/embedded-media-providers"]

[dependencies]
a4n-config = { path = "../a4n-config" }
a4n-runtime = { path = "../a4n-runtime", default-features = false }
a4n-storage = { path = "../a4n-storage" }
a4n-worker-contract = { path = "../a4n-worker-contract" }

anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
