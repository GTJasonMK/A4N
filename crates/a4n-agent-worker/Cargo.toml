[package]
name = "a4n-agent-worker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = []
embedded-llm-provider = []
embedded-media-providers = []

[dependencies]
a4n-agent-runtime = { path = "../a4n-agent-runtime" }
a4n-api-contract = { path = "../a4n-api-contract" }
a4n-config = { path = "../a4n-config" }
a4n-error = { path = "../a4n-error" }
a4n-llm-provider-contract = { path = "../a4n-llm-provider-contract" }
a4n-worker-contract = { path = "../a4n-worker-contract" }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
