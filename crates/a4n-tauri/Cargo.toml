[package]
name = "a4n-tauri"
version = "0.1.0"
edition = "2024"
default-run = "a4n-tauri"
license.workspace = true

[lib]
name = "a4n_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["migration"]
migration = ["a4n-runtime/migration"]
embedded-capabilities = [
    "migration",
    "a4n-runtime/embedded-capabilities",
]
embedded-media-providers = [
    "migration",
    "a4n-runtime/embedded-media-providers",
]
video-scrub-e2e-host = ["dep:base64"]

[[bin]]
name = "a4n-video-scrub-e2e-host"
path = "src/video_scrub_e2e_host.rs"
required-features = ["video-scrub-e2e-host"]

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
a4n-api-contract = { path = "../a4n-api-contract" }
a4n-config = { path = "../a4n-config" }
a4n-error = { path = "../a4n-error", features = ["database"] }
a4n-media = { path = "../a4n-media" }
a4n-runtime = { path = "../a4n-runtime", default-features = false }
a4n-server = { path = "../a4n-server" }
a4n-service-protocol = { path = "../a4n-service-protocol" }
a4n-storage = { path = "../a4n-storage" }
a4n-task-runtime = { path = "../a4n-task-runtime" }

# 异步
tokio = { workspace = true }
reqwest = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 配置解析
toml = "0.9"

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"

# 并发工具
tokio-util = { workspace = true }
base64 = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
a4n-db = { path = "../a4n-db" }
a4n-migration = { path = "../a4n-migration" }
a4n-test-support = { path = "../a4n-test-support" }
base64 = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
