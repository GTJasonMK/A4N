[package]
name = "a4n-tauri"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
embedded-capabilities = [
    "a4n-runtime/migration",
    "a4n-runtime/embedded-capabilities",
]
embedded-media-providers = [
    "a4n-runtime/migration",
    "a4n-runtime/embedded-media-providers",
]

[dependencies]
a4n-api-contract = { path = "../a4n-api-contract" }
anyhow = { workspace = true }
a4n-core = { path = "../a4n-core" }
a4n-runtime = { path = "../a4n-runtime", default-features = false }
a4n-service-protocol = { path = "../a4n-service-protocol" }

# Tauri
tauri = { workspace = true }

# 异步
tokio = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 配置解析
toml = "0.9"

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"

# 并发工具
parking_lot = { workspace = true }
tokio-util = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
a4n-db = { path = "../a4n-db" }
a4n-migration = { path = "../a4n-migration" }
a4n-test-support = { path = "../a4n-test-support" }
base64 = { workspace = true }
sea-orm = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
