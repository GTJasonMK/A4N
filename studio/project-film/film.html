function plane(texture,x,y,width,height,ry,rx=0,rz=0,alpha=1){

    return [x+x2*scale,y+y2*scale];

  function triangle(uv){

    const [a,b,d]=s,den=a[0]*(b[1]-d[1])+b[0]*(d[1]-a[1])+d[0]*(a[1]-b[1]);
    const coeff=index=>[

      (pts[0][index]*(d[0]-b[0])+pts[1][index]*(a[0]-d[0])+pts[2][index]*(b[0]-a[0]))/den,

  }

    saved(()=>{c.shadowColor="#00000077";c.shadowBlur=50;c.shadowOffsetY=30;path([p(0,0),p(1,0),p(1,1),p(0,1)],"#17232c");});

  overlay.querySelector("button").onclick=async()=>{
    if(!sound.src){
      // ponytail: this two-minute mix fits in memory; use HTTP ranges for long films.
      const response=await fetch("out/master.wav");if(!response.ok)throw Error("Unable to load soundtrack");
      sound.src=URL.createObjectURL(await response.blob());
    }
    await sound.play();overlay.style.display="none";
  };
  const tick=()=>{drawFrame(Math.min(120,sound.currentTime));requestAnimationFrame(tick);};tick();
  document.addEventListener("keydown",event=>{
    if(event.code==="Space"){event.preventDefault();if(sound.paused)overlay.querySelector("button").click();else sound.pause();}
    if(event.code==="ArrowRight")sound.currentTime=Math.min(119.9,sound.currentTime+5);
    if(event.code==="ArrowLeft")sound.currentTime=Math.max(0,sound.currentTime-5);
  });
  sound.onended=()=>{overlay.style.display="grid";overlay.querySelector("button").textContent="重新播放";sound.currentTime=0;};
}
init().catch(error=>{document.querySelector("#play button").textContent=error.message;throw error;});
</script>
</html>
